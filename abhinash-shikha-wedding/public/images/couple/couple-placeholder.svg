<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F0" />
      <stop offset="50%" stop-color="#F5EBDD" />
      <stop offset="100%" stop-color="#EADCC8" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC875" />
      <stop offset="50%" stop-color="#C9A45C" />
      <stop offset="100%" stop-color="#9E7933" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#goldBorder)" stroke-width="2" rx="16" />
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="#C9A45C" stroke-width="1" stroke-dasharray="6,4" rx="12" opacity="0.6" />

  <!-- Arch Frame -->
  <path d="M70 730 L70 300 Q300 80 530 300 L530 730 Z" fill="#FFF9F0" stroke="url(#goldBorder)" stroke-width="1.5" opacity="0.7" />

  <!-- Central Silhouette / Rings Icon -->
  <g transform="translate(300, 360)">
    <!-- Royal Rings Motif -->
    <circle cx="-25" cy="0" r="45" fill="none" stroke="#C9A45C" stroke-width="3.5" />
    <circle cx="25" cy="0" r="45" fill="none" stroke="#ECC875" stroke-width="3.5" />
    <polygon points="-25,-45 -18,-58 -32,-58" fill="#C9A45C" />
    <circle cx="-25" cy="-62" r="6" fill="#ECC875" />
  </g>

  <!-- Title & Instructions -->
  <text x="300" y="470" text-anchor="middle" font-family="'Cinzel', serif" font-size="24" font-weight="600" fill="#7A1F2B" letter-spacing="4">
    ABINASH &amp; SHIKHA
  </text>
  <text x="300" y="505" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" font-style="italic" fill="#C9A45C">
    Photograph Placeholder
  </text>
  <text x="300" y="540" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6B5B57">
    Replace with your couple photo in public/images/
  </text>
  <text x="300" y="565" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#9E7933">
    Recommended aspect ratio: 3:4 or Portrait
  </text>
</svg>
